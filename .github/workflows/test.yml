name: Vérification de MÉLODIA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Vérifier la syntaxe Python
        run: python -m compileall -q app.py ace_client.py text_tools.py tests/
      - name: Tests unitaires sans requête externe
        run: python -m unittest discover -s tests -v
      - name: Test minimal de l'interface Streamlit
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file("app.py").run(timeout=40)
          if app.exception:
              raise RuntimeError(str([x.message for x in app.exception]))
          print("Interface initialisée sans erreur.")
          PY
      - name: Vérifier le serveur HTTP Streamlit
        run: |
          set -eu
          python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 > /tmp/melodia-streamlit.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 40); do
            if curl -fsS --max-time 2 http://127.0.0.1:8501/_stcore/health | grep -q ok; then
              READY=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            cat /tmp/melodia-streamlit.log
            exit 1
          fi
          curl -fsS --max-time 10 http://127.0.0.1:8501/ -o /tmp/melodia-home.html
          grep -qi "streamlit" /tmp/melodia-home.html
          echo "Démarrage HTTP et point de santé Streamlit OK"
